[config]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell.qml'
output_path = '~/.config/quickshell/Theme/Theme.qml'
post_hook = 'qs ipc call theme-manager reload'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'pkill -USR2 ghostty || true'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.ohmyposh]
input_path = '~/.config/matugen/templates/ohmyposh.toml'
output_path = '~/.config/ohmyposh/noss.toml'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.json'
output_path = '~/.config/nvim/colors.json'
post_hook = "pkill -SIGUSR1 nvim"

[templates.tmux2k]
input_path = '~/.config/matugen/templates/tmux2k-colors.conf'
output_path = '~/.config/tmux/tmux2k-colors.conf'

[templates.tmux]
input_path = '~/.config/matugen/templates/tmux-colors.conf'
output_path = '~/.config/tmux/generated.conf'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf'
